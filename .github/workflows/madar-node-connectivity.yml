name: Madar read-only connectivity diagnostic
on:
  push:
    branches: [feat/node-availability-alerts-20261020]
    paths: [.github/workflows/madar-node-connectivity.yml]
permissions:
  contents: read
jobs:
  tcp-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Test public shared-443 reachability without VPN credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import socket,time,statistics,datetime,json
          nodes={'Stockholm Node1':'13.51.138.193','AWS Stockholm 2':'13.62.181.33'}
          out={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'vantage':'GitHub Actions ubuntu-24.04 runner (not Iran)','checks':[]}
          for name,ip in nodes.items():
              lat,errors=[],[]
              for i in range(8):
                  start=time.monotonic()
                  try:
                      with socket.create_connection((ip,443),timeout=5):
                          lat.append(round((time.monotonic()-start)*1000,1))
                  except OSError as e:
                      errors.append(type(e).__name__)
                  if i < 7: time.sleep(.35)
              result={'name':name,'ip':ip,'port':443,'attempts':8,'tcp_success':len(lat),'tcp_failed':len(errors),
                 'tcp_connect_ms':lat,'min_ms':min(lat) if lat else None,
                 'median_ms':round(statistics.median(lat),1) if lat else None,
                 'max_ms':max(lat) if lat else None,'error_types':list(sorted(set(errors)))}
              out['checks'].append(result)
              print('TCP_443_DIAGNOSTIC',json.dumps(result,ensure_ascii=False))
          out['limitations']='TCP handshake only, NOT VPN protocol authentication, streaming throughput, user-carrier packet loss, or server CPU'
          with open('connectivity.json','w') as f:json.dump(out,f,indent=2)
          PY
      - name: Preserve timestamped findings
        uses: actions/upload-artifact@v4
        with:
          name: madar-connectivity-read-only
          path: connectivity.json
          retention-days: 3
