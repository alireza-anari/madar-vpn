name: Madar guarded WSS admin trial Worker-only release

on:
  push:
    branches: ['feat/madar-per-node-wss-trial-20261109']
    paths: ['docs/sales-bot/release-admin-wss-trial-trigger.md']

permissions:
  contents: read

concurrency:
  group: madar-sales-worker-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message == '[approved-wss-trial-worker] publish admin WSS trial bot'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: 2e4e0d025c81b9134fd2d19f17535e30
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCRIPT: madar-sales-bot
      DB_ID: f59e160f-89ab-4a90-a4dc-f257883d5a61
      PREVIOUS_VERSION: 12c0782a-261c-4970-8868-6a542fa029f5
      BASE_URL: https://madar-sales-bot.alirezaanari117.workers.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact green application files and allowed release-only edits
        run: |
          set -euo pipefail
          validated=ded5ab7bb30db8d4b55017d7be12a0a0ac06bd22
          git merge-base --is-ancestor "$validated" HEAD
          git diff --exit-code "$validated" HEAD -- apps/sales-bot sales-node sales-runner pnpm-lock.yaml
          changed="$(git diff --name-only "$validated" HEAD)"
          while IFS= read -r file; do
            case "$file" in
              docs/sales-bot/admin-wss-trial-operator.md|docs/sales-bot/release-admin-wss-trial-trigger.md|.github/workflows/release-admin-wss-trial.yml) ;;
              "") ;;
              *) echo "Unexpected post-CI change: $file"; exit 1 ;;
            esac
          done <<< "$changed"
          grep -q '"keep_vars": true' apps/sales-bot/wrangler.jsonc
          grep -q '"crons": \["\* \* \* \* \*"\]' apps/sales-bot/wrangler.jsonc
          echo GREEN_WORKER_ONLY_TREE_CONFIRMED

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reverify Worker regression before publication
        run: |
          set -euo pipefail
          pnpm --filter @madar/sales-bot types
          pnpm --filter @madar/sales-bot typecheck
          pnpm --filter @madar/sales-bot test
          pnpm --filter @madar/sales-bot build

      - name: Verify exact production baseline bindings, cron and auth
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Cloudflare release token required}"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl --fail-with-body -sS --retry 2 -H "$auth" "$api/workers/scripts/$SCRIPT/deployments" |
            jq -e --arg prior "$PREVIOUS_VERSION" '.success == true and .result.deployments[0].versions == [{"version_id":$prior,"percentage":100}]' >/dev/null
          curl --fail-with-body -sS --retry 2 -H "$auth" "$api/workers/scripts/$SCRIPT/settings" |
            jq -e --arg db "$DB_ID" '
              .success == true and
              ([.result.bindings[] | select(.name=="SALES_DB" and .type=="d1" and
                  ((.id // .database_id)==$db))] | length==1) and
              ([.result.bindings[].name] |
                  (index("ADMIN_TELEGRAM_IDS") != null) and
                  (index("PUBLIC_BASE_URL") != null) and
                  (index("RUNNER_PUBLIC_KEY") != null) and
                  (index("BOT_TOKEN") != null) and
                  (index("TELEGRAM_WEBHOOK_SECRET") != null) and
                  (index("POLICY_SIGNING_SECRET") != null) and
                  (index("RUNNER_SERVICE_SECRET") != null) and
                  (index("USAGE_LINK_SECRET") != null))' >/dev/null
          curl --fail-with-body -sS --retry 2 -H "$auth" "$api/workers/scripts/$SCRIPT/schedules" |
            jq -e '.success == true and any(.result.schedules[]; .cron=="* * * * *")' >/dev/null
          curl -fsS --connect-timeout 5 --max-time 15 "$BASE_URL/health" |
            jq -e '.status=="prepared" and .telegram=="configured"' >/dev/null
          test "$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$BASE_URL/api/customer/me")" = 403
          test "$(curl -sS --connect-timeout 5 --max-time 15 -X POST -o /dev/null -w '%{http_code}' "$BASE_URL/webhook")" = 401
          echo SAFE_ADMIN_WSS_RELEASE_PREFLIGHT_PASSED

      - name: Publish only the verified Telegram Worker (preserve all bindings)
        id: deploy
        run: pnpm --filter @madar/sales-bot exec wrangler deploy --message "Madar per-node admin WSS trials; existing nodes untouched"

      - name: Verify active release, bindings, cron and protected routes
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ok=0
          for i in $(seq 1 20); do
            body="$(curl -fsS --connect-timeout 5 --max-time 15 "$BASE_URL/health" || true)"
            if echo "$body" | jq -e '.status=="prepared" and .telegram=="configured"' >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          test "$ok" -eq 1
          for route in /app /customer /customer.css /customer.js /madar-logo.png; do
            test "$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$BASE_URL$route")" = 200
          done
          test "$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$BASE_URL/api/customer/me")" = 403
          test "$(curl -sS --connect-timeout 5 --max-time 15 -X POST -o /dev/null -w '%{http_code}' "$BASE_URL/webhook")" = 401
          test "$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$BASE_URL/managed-subscription/v1/invalid")" = 404
          curl --fail-with-body -sS -H "$auth" "$api/workers/scripts/$SCRIPT/settings" |
            jq -e --arg db "$DB_ID" '
              .success == true and
              ([.result.bindings[] | select(.name=="SALES_DB" and .type=="d1" and
                ((.id // .database_id)==$db))] | length==1) and
              ([.result.bindings[].name] |
                (index("ADMIN_TELEGRAM_IDS")!=null) and
                (index("PUBLIC_BASE_URL")!=null) and
                (index("RUNNER_PUBLIC_KEY")!=null) and
                (index("BOT_TOKEN")!=null) and
                (index("TELEGRAM_WEBHOOK_SECRET")!=null) and
                (index("POLICY_SIGNING_SECRET")!=null) and
                (index("RUNNER_SERVICE_SECRET")!=null) and
                (index("USAGE_LINK_SECRET")!=null))' >/dev/null
          curl --fail-with-body -sS -H "$auth" "$api/workers/scripts/$SCRIPT/schedules" |
            jq -e '.success==true and any(.result.schedules[]; .cron=="* * * * *")' >/dev/null
          curl --fail-with-body -sS -H "$auth" "$api/workers/scripts/$SCRIPT/deployments" |
            jq -e --arg prior "$PREVIOUS_VERSION" '
              .success == true and
              .result.deployments[0].versions[0].percentage==100 and
              .result.deployments[0].versions[0].version_id != $prior' >/dev/null
          echo ADMIN_WSS_TRIAL_WORKER_PRODUCTION_OK_NODES_UNCHANGED

      - name: Restore previous Worker if publication or verification failed
        if: ${{ failure() && steps.deploy.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT/deployments"
          body="$(printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}],"annotations":{"workers/message":"Rollback failed admin WSS trial Worker release"}}' "$PREVIOUS_VERSION")"
          curl --fail-with-body -sS --retry 2 -X POST "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$body" >/dev/null
          echo PRIOR_PRODUCTION_WORKER_RESTORED
