name: Mini App lock helper

on:
  push:
    branches:
      - impl/telegram-miniapp-dashboard-20261017

jobs:
  lock:
    if: contains(github.event.head_commit.message, 'generate qrcode lockfile')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @madar/sales-bot add --save-exact qrcode@1.5.4
      - run: pnpm --filter @madar/sales-bot add --save-exact -D @types/qrcode@1.5.6
      - uses: actions/upload-artifact@v4
        with:
          name: miniapp-qrcode-lock
          path: |
            apps/sales-bot/package.json
            pnpm-lock.yaml
          if-no-files-found: error
