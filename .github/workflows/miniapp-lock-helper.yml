name: Mini App lock helper

on:
  push:
    branches:
      - impl/telegram-miniapp-dashboard-20261017

permissions:
  contents: write

jobs:
  lock:
    if: contains(github.event.head_commit.message, 'generate qrcode lockfile')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @madar/sales-bot add --save-exact qrcode@1.5.4
      - run: pnpm --filter @madar/sales-bot add --save-exact -D @types/qrcode@1.5.6
      - name: Commit generated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/sales-bot/package.json pnpm-lock.yaml
          git commit -m "chore: pin qrcode dependency"
          git push origin HEAD:impl/telegram-miniapp-dashboard-20261017
