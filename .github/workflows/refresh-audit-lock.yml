name: Refresh audited dependency lock

on:
  push:
    branches: ['impl/phase-1']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@12.9.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --fix --audit-level high
      - run: pnpm install --lockfile-only
      - run: pnpm audit --audit-level high
      - name: Commit audited lock when changed
        run: |
          if ! git diff --quiet -- pnpm-workspace.yaml pnpm-lock.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-workspace.yaml pnpm-lock.yaml
            git commit -m 'fix: patch audited transitive dependencies'
            git push origin HEAD:impl/phase-1
          fi
