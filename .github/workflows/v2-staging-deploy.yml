name: Madar V2 guarded staging release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Type madar-v2-staging exactly
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: madar-v2-staging-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/rewrite/madar-v2-20261110' && inputs.target == 'madar-v2-staging'
    runs-on: ubuntu-latest
    environment: madar-v2-staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 2e4e0d025c81b9134fd2d19f17535e30
      CLOUDFLARE_API_TOKEN: ${{ secrets.MADAR_V2_STAGING_CF_TOKEN }}
      BASE_URL: https://madar-v2-staging.alirezaanari117.workers.dev
      DB_ID: 81e78af9-9740-45da-9e80-9b2d498f4f54
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-check allowed branch, DB and source
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Independent staging deploy token required}"
          grep -q '"name": "madar-v2-staging"' v2/control/wrangler.jsonc
          grep -q "$DB_ID" v2/control/wrangler.jsonc
          grep -q '"keep_vars": true' v2/control/wrangler.jsonc
          ! grep -q 'f59e160f-89ab-4a90-a4dc-f257883d5a61' v2/control/wrangler.jsonc
          (cd v2/control && npm run check && npm test)
          python3 v2/control/test/schema.test.py
          (cd v2/node-agent && python3 -m unittest discover -s tests)
      - name: Confirm remote Worker still uses staging D1
        run: |
          curl -fsS --retry 2 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/madar-v2-staging/settings" |
            jq -e --arg db "$DB_ID" '.success == true and any(.result.bindings[]; .type=="d1" and .name=="DB" and .id==$db)' >/dev/null
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies and deploy V2 only
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @madar/sales-bot exec wrangler deploy --config ../../v2/control/wrangler.jsonc
      - name: Verify live and unauthenticated webhook rejection
        run: |
          curl -fsS --retry 3 --retry-delay 2 "$BASE_URL/health/live" | jq -e '.status=="alive" and .service=="madar-v2"' >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$BASE_URL/telegram/webhook")" = 401
          status="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/health/ready")"
          test "$status" = 503 -o "$status" = 200
          echo STAGING_RELEASE_VERIFIED
