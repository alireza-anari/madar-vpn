name: Madar V2 PR70 offline production module
on:
  push:
    branches:
      - release/v2-pr70-offline-production-20261119
    paths:
      - .github/workflows/v2-pr70-offline-bundle.yml

permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, 'BUILD-V2-PR70-BUNDLE-ONCE')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated V2 control and SQLite migration regression tests
        run: |
          set -euo pipefail
          test "$(jq -r '.name' v2/control/wrangler.jsonc)" = 'madar-v2-staging'
          test "$(jq -r '.d1_databases[0].database_id' v2/control/wrangler.jsonc)" = '81e78af9-9740-45da-9e80-9b2d498f4f54'
          test "$(jq -r '.keep_vars' v2/control/wrangler.jsonc)" = true
          (cd v2/control && npm run check && npm test)
          python3 v2/control/test/schema.test.py
          (cd v2/node-agent && python3 -m unittest discover -s tests)
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build precisely the existing V2 Worker offline
        run: |
          set -euo pipefail
          pnpm --filter @madar/sales-bot exec wrangler deploy --dry-run \
            --outdir /tmp/v2-pr70-module --config ../../v2/control/wrangler.jsonc
          test -s /tmp/v2-pr70-module/index.js
          test "$(stat -c %s /tmp/v2-pr70-module/index.js)" -lt 2000000
          grep -q 'PROVISIONING_ENABLED' /tmp/v2-pr70-module/index.js
          grep -q 'SUBSCRIPTION_API_ENABLED' /tmp/v2-pr70-module/index.js
          mkdir -p v2/release-dist
          cp /tmp/v2-pr70-module/index.js v2/release-dist/production-pr70-v2-worker.mjs
          sha256sum v2/release-dist/production-pr70-v2-worker.mjs
      - name: Commit compiled V2-only module for authenticated Cloudflare upload
        run: |
          set -euo pipefail
          git config user.name 'Madar V2 isolated build'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add v2/release-dist/production-pr70-v2-worker.mjs
          git commit -m 'build(v2): verified PR70 worker bundle without secrets'
          git push origin HEAD:release/v2-pr70-offline-production-20261119
