name: Vision release lockfile refresh (one-time)
on:
  push:
    branches: ['impl/production-vision-optin-20261103']
    paths:
      - pnpm-workspace.yaml
      - .github/workflows/vision-lock-refresh.yml
permissions:
  contents: write
jobs:
  patch-lock:
    runs-on: ubuntu-latest
    if: github.repository == 'alireza-anari/madar-vpn' && github.ref == 'refs/heads/impl/production-vision-optin-20261103'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@12.9.1 --activate
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Commit only verified lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo LOCKFILE_ALREADY_CURRENT
            exit 0
          fi
          git diff --cached --stat
          git commit -m "security(lock): regenerate patched transitive Vite Zod Undici dependencies"
          git push origin HEAD:refs/heads/impl/production-vision-optin-20261103
