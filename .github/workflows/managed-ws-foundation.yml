name: Madar managed WS foundation regression

on:
  push:
    branches:
      - 'impl/madar-managed-fallback-foundation-20261107'
    paths:
      - 'sales-node/**'
      - 'sales-runner/**'
      - 'apps/sales-bot/**'
      - '.github/workflows/managed-ws-foundation.yml'
  pull_request:
    paths:
      - 'sales-node/**'
      - 'sales-runner/**'
      - 'apps/sales-bot/**'
      - '.github/workflows/managed-ws-foundation.yml'

permissions:
  contents: read

jobs:
  python-ws-and-manifest:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: sales-node:sales-runner
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check pytest==8.4.2 cryptography==50.0.2 paramiko==5.0.0
      - run: python3 -m compileall -q sales-node sales-runner
      - name: Validate new WS routing, legacy quota, source pinning and runner
        run: |
          python3 -m pytest -q \
            sales-node/tests \
            sales-runner/tests/test_source_manifest.py \
            sales-runner/tests/test_installer.py
      - name: Fetch source-hash-verified pinned Xray binary (CI only)
        run: |
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'sales-runner')
          from artifacts import VERSION, download
          binary = download('x86_64', VERSION)['xray']
          target = pathlib.Path('/tmp/madar-ci-xray')
          target.write_bytes(binary)
          target.chmod(0o755)
          print('Validated pinned Xray release', VERSION)
          PY
      - name: Check real Xray HandlerService registration and revoke (isolated loopback)
        env:
          MADAR_XRAY_BIN: /tmp/madar-ci-xray
        run: python3 -m pytest -q sales-node/tests/test_alt_xray_integration.py
      - name: Validate Caddy WSS field-only Xray config using pinned real core
        env:
          MADAR_XRAY_BIN: /tmp/madar-ci-xray
        run: python3 -m pytest -q sales-node/tests/test_field_wss_canary.py
      - name: Production opt-in must not be a default
        run: |
          ! grep -q "'managedWsOptIn':True" sales-runner/installer.py
          ! grep -q '"managedWsOptIn":true' sales-runner/installer.py
