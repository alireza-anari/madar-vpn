name: Telegram sales bot
on:
  push:
    branches: ['impl/telegram-sales-bot', 'design/telegram-sales-bot']
  pull_request:
    paths: ['apps/sales-bot/**', 'sales-runner/**', 'sales-node/**', '.github/workflows/sales-bot.yml', 'pnpm-lock.yaml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @madar/sales-bot types
      - run: pnpm --filter @madar/sales-bot typecheck
      - run: pnpm --filter @madar/sales-bot test
      - run: pnpm --filter @madar/sales-bot build
      - name: Cloudflare deployment credential preflight (presence only)
        env:
          TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$TOKEN_SET" = "true" ]; then echo CF_TOKEN_CONFIGURED; else echo CF_TOKEN_NOT_CONFIGURED; fi
          if [ "$ACCOUNT_SET" = "true" ]; then echo CF_ACCOUNT_CONFIGURED; else echo CF_ACCOUNT_NOT_CONFIGURED; fi
      - uses: actions/upload-artifact@v4
        with:
          name: madar-alert-worker-verified-bundle
          path: apps/sales-bot/dist/
          retention-days: 2
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install paramiko==5.0.0 cryptography==50.0.2 pytest==9.0.2
      - run: cd sales-runner && python -m pytest
      - run: cd sales-node && python -m pytest
      - run: sudo env PYTHONPATH=sales-node "$(command -v python)" -m pytest sales-node/tests/test_personal_install.py
      - run: python scripts/verify_sales_quota_probe.py
      - name: Independent read-only TCP checks for sales nodes
        run: |
          python3 - <<'PY'
          import socket,time,statistics,json,datetime
          print('Checked UTC:',datetime.datetime.now(datetime.timezone.utc).isoformat())
          for name,ip in [('Stockholm Node1','13.51.138.193'),('AWS Stockholm 2','13.62.181.33')]:
              samples=[]; errors=[]
              for k in range(8):
                  start=time.monotonic()
                  try:
                      with socket.create_connection((ip,443),timeout=5):
                          samples.append(round(1000*(time.monotonic()-start),1))
                  except OSError as e:errors.append(type(e).__name__)
                  if k<7:time.sleep(.35)
              print('NODE_TCP443',json.dumps({'node':name,'ip':ip,'ok':len(samples),'attempts':8,'median_ms':round(statistics.median(samples),1) if samples else None,'min_ms':min(samples) if samples else None,'max_ms':max(samples) if samples else None,'samples_ms':samples,'errors':errors}))
          print('LIMITATION: TCP open only, not VPN throughput/auth, provider path or CPU')
          PY
