name: Telegram sales bot
on:
  push:
    branches: ['impl/telegram-sales-bot', 'design/telegram-sales-bot']
  pull_request:
    paths: ['apps/sales-bot/**', 'sales-runner/**', 'sales-node/**', '.github/workflows/sales-bot.yml', 'pnpm-lock.yaml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @madar/sales-bot types
      - run: pnpm --filter @madar/sales-bot typecheck
      - run: pnpm --filter @madar/sales-bot test
      - run: pnpm --filter @madar/sales-bot build
      - name: Cloudflare deployment credential preflight (presence only)
        env:
          TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$TOKEN_SET" = "true" ]; then echo CF_TOKEN_CONFIGURED; else echo CF_TOKEN_NOT_CONFIGURED; fi
          if [ "$ACCOUNT_SET" = "true" ]; then echo CF_ACCOUNT_CONFIGURED; else echo CF_ACCOUNT_NOT_CONFIGURED; fi
      - uses: actions/upload-artifact@v4
        with:
          name: madar-alert-worker-verified-bundle
          path: apps/sales-bot/dist/
          retention-days: 2
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install paramiko==5.0.0 cryptography==50.0.2 pytest==9.0.2
      - run: cd sales-runner && python -m pytest
      - run: cd sales-node && python -m pytest
      - run: sudo env PYTHONPATH=sales-node "$(command -v python)" -m pytest sales-node/tests/test_personal_install.py
      - run: python scripts/verify_sales_quota_probe.py

  deploy_node_availability:
    # Explicitly limited to Madar PR #7 from this repository. Runs only after
    # the complete bot/agent/quota verification job succeeds.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == 'alireza-anari/madar-vpn' && github.event.pull_request.head.ref == 'feat/node-availability-alerts-20261020' }}
    needs: verify
    runs-on: ubuntu-24.04
    concurrency:
      group: madar-worker-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require deployment credential
        env:
          CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          test "$CF_TOKEN_PRESENT" = "true" || { echo 'Cloudflare token missing; refusing deployment'; exit 1; }
      - name: Verify Worker remains scoped to exact production D1 and one-minute cron
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('apps/sales-bot/wrangler.jsonc','utf8').replace(/,\s*([}\]])/g,'$1'));
          if(c.name !== 'madar-sales-bot' || c.keep_vars !== true ||
             c.d1_databases?.length!==1 ||
             c.d1_databases[0].binding!=='SALES_DB' ||
             c.d1_databases[0].database_id!=='f59e160f-89ab-4a90-a4dc-f257883d5a61' ||
             JSON.stringify(c.triggers?.crons)!==JSON.stringify(['* * * * *'])) {
            throw new Error('Unexpected Wrangler production config; refusing deployment');
          }
          console.log('Madar production Worker config is pinned; existing variables will be preserved.');
          JS
      - name: Deploy tested Worker with existing variables preserved
        working-directory: apps/sales-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2e4e0d025c81b9134fd2d19f17535e30
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm exec wrangler deploy --keep-vars
