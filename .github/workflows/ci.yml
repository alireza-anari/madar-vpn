name: CI

on:
  push:
    branches: ['impl/**', 'main']
  pull_request:
    branches: ['main']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@12.9.1 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
