name: CI

on:
  push:
    branches: ['impl/**', 'main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/security_scan.py .
      - run: corepack enable
      - run: corepack prepare pnpm@12.9.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: python3 -m pip install --disable-pip-version-check -r node-agent/requirements-dev.txt
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:python
