name: Madar V2 offline bundle for connector-authorized Cloudflare release
on:
  push:
    branches:
      - release/madar-v2-single-20261119
    paths:
      - .github/workflows/v2-offline-bundle.yml
permissions:
  contents: write
jobs:
  build-v2-bundle:
    if: contains(github.event.head_commit.message, 'BUILD-V2-MODULE-BUNDLE-ONCE')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build V2 Worker code without deploying or Cloudflare credentials
        run: |
          set -euo pipefail
          test "$(jq -r '.name' v2/control/wrangler.jsonc)" = 'madar-v2-staging'
          test "$(jq -r '.d1_databases[0].database_id' v2/control/wrangler.jsonc)" = '81e78af9-9740-45da-9e80-9b2d498f4f54'
          pnpm --filter @madar/sales-bot exec wrangler deploy --dry-run --outdir /tmp/v2-single-dist --config ../../v2/control/wrangler.jsonc
          find /tmp/v2-single-dist -type f -maxdepth 2 -printf '%P %s bytes\n' | sort
          test -f /tmp/v2-single-dist/index.js
          test "$(stat -c %s /tmp/v2-single-dist/index.js)" -lt 2000000
          mkdir -p v2/release-dist
          cp /tmp/v2-single-dist/index.js v2/release-dist/single-v2-worker.mjs
          echo "BUNDLE_SIZE=$(stat -c %s v2/release-dist/single-v2-worker.mjs)"
      - name: Commit V2-only generated source for authorized connector upload
        run: |
          set -euo pipefail
          git config user.name 'Madar V2 isolated build'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add v2/release-dist/single-v2-worker.mjs
          git commit -m 'build(v2): compiled isolated V2 worker module, no credentials'
          git push origin HEAD:release/madar-v2-single-20261119
