name: Madar V2 on-demand SSH executor (no resident runner)
run-name: V2 one-time node job
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Exact queued V2 job UUID (never credentials)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: madar-v2-job-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  execute:
    if: github.ref == 'refs/heads/rewrite/madar-v2-20261110'
    runs-on: ubuntu-24.04
    environment: madar-v2-staging
    timeout-minutes: 19
    env:
      MADAR_V2_URL: https://madar-v2-staging.alirezaanari117.workers.dev
      MADAR_V2_RUNNER_SERVICE_SECRET: ${{ secrets.MADAR_V2_RUNNER_SERVICE_SECRET }}
      MADAR_V2_RUNNER_PRIVATE_KEY_PEM: ${{ secrets.MADAR_V2_RUNNER_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed if independent V2 credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MADAR_V2_RUNNER_SERVICE_SECRET"
          test -n "$MADAR_V2_RUNNER_PRIVATE_KEY_PEM"
          [[ "${{ inputs.job_id }}" =~ ^[a-f0-9]{8}-([a-f0-9]{4}-){3}[a-f0-9]{12}$ ]]
          test -f v2/runner/one_shot.py
      - name: Install fixed SSH client dependencies
        run: python3 -m pip install --disable-pip-version-check paramiko==5.0.0 cryptography==50.0.2
      - name: Verify GitHub and Cloudflare share the V2 runner service secret
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 12 -X POST "$MADAR_V2_URL/api/runner/verify" \
            -H "authorization: Bearer $MADAR_V2_RUNNER_SERVICE_SECRET" \
            -H "content-type: application/json" --data '{}')"
          if [[ "$code" != "200" ]]; then
            echo "RUNNER_SERVICE_SECRET_MISMATCH_OR_WORKER_UNAVAILABLE (HTTP $code)"
            exit 1
          fi
          echo "V2_RUNNER_AUTH_OK"
      - name: Validate and load the V2 RSA private key without printing it
        run: python3 -B -c "import os,sys; sys.path.insert(0,'v2/runner'); from one_shot import load_private_key; load_private_key(os.environ.get('MADAR_V2_RUNNER_PRIVATE_KEY_PEM','')); print('V2_PRIVATE_KEY_OK')"
      - name: Execute exactly this V2 job, with no V1 keys and no AWS IAM mutation
        run: python3 -B v2/runner/one_shot.py --job-id "${{ inputs.job_id }}"
      - name: Report failed queued V2 job to control plane without SSH credentials
        if: failure()
        run: |
          curl --silent --show-error --fail --retry 2 --connect-timeout 5 --max-time 15 \
            -X POST "$MADAR_V2_URL/api/runner/abort-queued" \
            -H "authorization: Bearer $MADAR_V2_RUNNER_SERVICE_SECRET" \
            -H "content-type: application/json" \
            --data '{"runnerId":"v2-github-actions","jobId":"${{ inputs.job_id }}"}' \
            || echo "V2_FAILURE_REPORT_UNAVAILABLE: verify the shared service secret"
