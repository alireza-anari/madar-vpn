name: One-time V2 custom node ID smoke check

on:
  push:
    branches: ['rewrite/madar-v2-20261110']
    paths: ['.github/workflows/v2-node-id-smoke-once.yml']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Worker enrollment form accepts custom IDs
        env:
          BASE_URL: https://madar-v2-staging.alirezaanari117.workers.dev
        run: |
          set -euo pipefail
          curl -fsS --retry 2 "$BASE_URL/health/live" | jq -e '.status=="alive" and .service=="madar-v2"'
          curl -fsS --retry 2 "$BASE_URL/enroll" -o /tmp/enroll.html
          grep -Fq 'placeholder="webdade6"' /tmp/enroll.html
          grep -Fq 'pattern="[A-Za-z][A-Za-z0-9_-]{2,63}"' /tmp/enroll.html
          grep -Fq 'پیشوند test- اجباری نیست' /tmp/enroll.html
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"nodeId":"webdade6"}' "$BASE_URL/api/enrollment/probe")"
          test "$code" = "401"
          echo V2_CUSTOM_NODE_ID_LIVE_OK
