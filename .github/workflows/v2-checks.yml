name: Madar V2 isolated checks

on:
  push:
    branches: ['rewrite/**']
    paths: ['v2/**', '.github/workflows/v2-checks.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/v2-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-control-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax & behavior tests without production secrets
        working-directory: v2/control
        run: |
          npm run check
          npm test
      - name: Check new D1 schema invariants and quota constraints
        run: python3 v2/control/test/schema.test.py
      - name: Check read-only network diagnostic probe
        run: python3 -m unittest discover -s v2/diagnostics -p 'test_*.py'
      - name: Verify no production DB bound to V2
        run: |
          ! grep -q 'f59e160f-89ab-4a90-a4dc-f257883d5a61' v2/control/wrangler.jsonc
          ! grep -q '"name": "madar-sales-bot"' v2/control/wrangler.jsonc

  v2-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build isolated Android shell and run state machine unit tests
        working-directory: v2/android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
