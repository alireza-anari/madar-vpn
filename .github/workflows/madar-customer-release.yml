name: Madar customer shop guarded production release
on:
  push:
    branches: [release/customer-self-service-20261024]
permissions:
  contents: read
concurrency:
  group: madar-sales-bot-production-release
  cancel-in-progress: false
jobs:
  guarded-release:
    # No automatic deploy on incidental branch pushes; require an explicit release marker.
    if: contains(github.event.head_commit.message, '[approved-customer-release]')
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: 2e4e0d025c81b9134fd2d19f17535e30
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCRIPT: madar-sales-bot
      DB_ID: f59e160f-89ab-4a90-a4dc-f257883d5a61
      PREVIOUS_VERSION: ec12031f-e499-4e55-b21b-9cc9fd2b6faf
      BASE_URL: https://madar-sales-bot.alirezaanari117.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin reviewed exact-green source and configuration
        run: |
          git merge-base --is-ancestor 87c54a6ccf6a0845fd4fc720a879024051d7a6d1 HEAD
          git diff --exit-code 87c54a6ccf6a0845fd4fc720a879024051d7a6d1 HEAD -- apps/sales-bot sales-runner sales-node pnpm-lock.yaml
          grep -q '"keep_vars": true' apps/sales-bot/wrangler.jsonc
          grep -q '"crons": \["\* \* \* \* \*"\]' apps/sales-bot/wrangler.jsonc
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @madar/sales-bot types
      - run: pnpm --filter @madar/sales-bot typecheck
      - run: pnpm --filter @madar/sales-bot test
      - run: pnpm --filter @madar/sales-bot build
      - name: Preflight exact production deployment, bindings, cron and D1
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Cloudflare token must be configured}"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$auth" "$api/workers/scripts/$SCRIPT/settings" > /tmp/madar-settings.json
          jq -e --arg db "$DB_ID" '
            .success == true and
            ([.result.bindings[] | select(.name == "SALES_DB" and ((.id // .database_id) == $db))] | length == 1) and
            ([.result.bindings[].name] |
              (index("BOT_TOKEN") != null) and
              (index("TELEGRAM_WEBHOOK_SECRET") != null) and
              (index("POLICY_SIGNING_SECRET") != null) and
              (index("USAGE_LINK_SECRET") != null) and
              (index("RUNNER_SERVICE_SECRET") != null) and
              (index("PUBLIC_BASE_URL") != null))
          ' /tmp/madar-settings.json >/dev/null
          curl -fsS -H "$auth" "$api/workers/scripts/$SCRIPT/deployments" > /tmp/madar-deployments.json
          actual="$(jq -r '.result.deployments[0].versions[0].version_id' /tmp/madar-deployments.json)"
          test "$actual" = "$PREVIOUS_VERSION" || { echo "::error::Production Worker version changed. Abort."; exit 1; }
          curl -fsS -H "$auth" "$api/workers/scripts/$SCRIPT/schedules" |
            jq -e '.success == true and any(.result.schedules[]; .cron == "* * * * *")' >/dev/null
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"sql":"SELECT name FROM d1_migrations WHERE name='\''0016-customer-checkout.sql'\''"}' \
            "$api/d1/database/$DB_ID/query" |
            jq -e '.success == true and .result[0].results[0].name == "0016-customer-checkout.sql"' >/dev/null
          # Paid renewals use additive migration 0017. Never deploy code before this schema is verified.
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"sql":"SELECT name FROM d1_migrations WHERE name='\''0017-customer-upgrades.sql'\''"}' \
            "$api/d1/database/$DB_ID/query" |
            jq -e '.success == true and .result[0].results[0].name == "0017-customer-upgrades.sql"' >/dev/null
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data '{"sql":"SELECT name FROM pragma_table_info('\''managed_accounts'\'') WHERE name='\''last_customer_upgrade_id'\''"}' \
            "$api/d1/database/$DB_ID/query" |
            jq -e '.success == true and .result[0].results[0].name == "last_customer_upgrade_id"' >/dev/null
          echo "All guarded production release preflights passed."
      - name: Deploy exact-green Worker preserving vars
        id: deploy
        run: pnpm --filter @madar/sales-bot exec wrangler deploy
      - name: Verify customer, reseller and unauthorized endpoints
        shell: bash
        run: |
          set -euo pipefail
          # Workers route propagation can briefly serve the prior deployment.
          # Wait for ALL new routes to appear together rather than treating a
          # short-lived 404 as a fatal code regression.
          ok=0
          for attempt in $(seq 1 25); do
            all_routes=1
            for path in /health /app /customer /customer.css /customer.js /madar-logo.png; do
              code="$(curl -sS --max-time 15 -o /tmp/madar-live-response -w '%{http_code}' "$BASE_URL$path")" || code=000
              if [ "$code" != 200 ]; then
                echo "Attempt $attempt: $path returned HTTP $code (waiting for route propagation)"
                all_routes=0
                break
              fi
              if [ "$path" = "/customer" ] && ! grep -q 'پنل مشتری' /tmp/madar-live-response; then
                echo "Attempt $attempt: customer page content does not match new release"
                all_routes=0
                break
              fi
            done
            if [ "$all_routes" -eq 1 ]; then
              unauth="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$BASE_URL/api/customer/me")" || unauth=000
              if [ "$unauth" != 403 ]; then
                echo "Attempt $attempt: unsigned customer API returned HTTP $unauth, expected 403"
              else
                echo "Customer and reseller production routes, assets and customer authorization verified"
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1 || { echo "::error::New production routes never became healthy; initiate rollback"; exit 1; }
          upgrade_api="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$BASE_URL/api/customer/upgrades")" || upgrade_api=000
          test "$upgrade_api" = 403 || { echo "::error::Unsigned upgrade API must be denied (got $upgrade_api)"; exit 1; }


          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$auth" "$api/workers/scripts/$SCRIPT/settings" |
            jq -e --arg db "$DB_ID" '.success == true and
            ([.result.bindings[] | select(.name == "SALES_DB" and ((.id // .database_id) == $db))] | length == 1) and
            ([.result.bindings[].name] |
              (index("ADMIN_TELEGRAM_IDS") != null) and
              (index("PUBLIC_BASE_URL") != null) and
              (index("RUNNER_PUBLIC_KEY") != null) and
              (index("BOT_TOKEN") != null) and
              (index("TELEGRAM_WEBHOOK_SECRET") != null) and
              (index("POLICY_SIGNING_SECRET") != null) and
              (index("USAGE_LINK_SECRET") != null) and
              (index("RUNNER_SERVICE_SECRET") != null))' >/dev/null
          curl -fsS -H "$auth" "$api/workers/scripts/$SCRIPT/schedules" |
            jq -e '.success == true and any(.result.schedules[]; .cron == "* * * * *")' >/dev/null
          echo "Live smoke, bindings and cron verification all passed."
      - name: Roll back Worker version after failed smoke
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SCRIPT/deployments"
          body="$(printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}]}' "$PREVIOUS_VERSION")"
          curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' --data "$body" "$api" >/dev/null
          echo "::warning::Prior Worker version restored; D1 additive migration retained."
