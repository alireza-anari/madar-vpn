name: Mark verified Task 31 complete

on:
  push:
    branches: ['impl/phase-1']

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mark only Task 31 verified items
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/superpowers/plans/2026-10-08-madar-implementation-plan.md')
          text = path.read_text(encoding='utf-8')
          items = [
              'Add API rate limits/abuse controls for login, subscription fetch, callbacks, admin, and node enrollment.',
              'Secret scanning and log-redaction tests.',
              'Dependency/security audit.',
              'CSRF/origin/session rotation review.',
              'Subscription bearer leakage review for logs/analytics/referrers.',
              'Audit-log completeness review.',
              'Commit hardening.',
          ]
          for item in items:
              old = f'- [ ] {item}'
              new = f'- [x] {item}'
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one unchecked Task 31 item: {item}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/mark-task31-complete.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/plans/2026-10-08-madar-implementation-plan.md
          git commit -m 'docs: mark task 31 complete'
          git push origin HEAD:impl/phase-1
