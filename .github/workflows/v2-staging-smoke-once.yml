name: Temporary Madar V2 staging smoke check

on:
  push:
    branches: ['rewrite/madar-v2-20261110']
    paths: ['.github/workflows/v2-staging-smoke-once.yml']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed staging Worker health
        env:
          BASE_URL: https://madar-v2-staging.alirezaanari117.workers.dev
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error --fail --retry 3 --retry-delay 2 "$BASE_URL/health/live")"
          echo "$body" | jq -e '.status=="alive" and .service=="madar-v2"'
          webhook="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "$BASE_URL/telegram/webhook")"
          test "$webhook" = "401"
          echo "STAGING_WORKER_SMOKE_OK"
