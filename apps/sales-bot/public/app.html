<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#08111f" />
  <title>مدار</title>
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="/app-admin.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app-shell" class="app-shell">
    <header class="topbar">
      <div class="brand-lockup" aria-label="مدار">
        <span class="brand-emblem"><span class="brand-mark" aria-hidden="true">M</span><img class="brand-logo" src="/madar-logo.png" width="48" height="48" alt="لوگوی مدار" onerror="this.hidden=true" /></span>
        <span><strong>مدار</strong><small>پنل مدیریت</small></span>
      </div>
      <button class="icon-button refresh-button" type="button" data-action="refresh" aria-label="به‌روزرسانی">
        <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M18 9a7 7 0 0 0-12-2L4 10M6 15a7 7 0 0 0 12 2l2-3"/></svg>
      </button>
    </header>
    <main id="app-content" class="app-content" aria-live="polite" aria-busy="true">
      <section class="card state-card loading-card">
        <span class="loading-orbit" aria-hidden="true"></span>
        <h1>در حال آماده‌سازی مدار</h1>
        <p>اطلاعات پنل در حال دریافت است…</p>
      </section>
    </main>
    <nav id="app-nav" class="bottom-nav" aria-label="ناوبری اصلی"></nav>
    <div id="app-toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script src="/app.js"></script>
  <script src="/app-admin.js"></script>
</body>
</html>
