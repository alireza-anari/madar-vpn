<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>مصرف اشتراک مدار</title><style>body{font:18px system-ui;background:#091222;color:#eaf2ff;margin:0;padding:24px}main{max-width:520px;margin:48px auto;background:#142138;border-radius:20px;padding:28px}h1{font-size:24px}dl{display:grid;grid-template-columns:1fr 1fr;gap:18px}dd{margin:0;direction:rtl}small{color:#aabbd3}#notice{color:#ffc969}progress{width:100%;height:16px}</style><main><h1 id="label">مصرف اشتراک مدار</h1><dl><dt>حجم کل</dt><dd id="total">—</dd><dt>مصرف ثبت‌شده</dt><dd id="used">—</dd><dt>باقی‌مانده</dt><dd id="remaining">—</dd><dt>انقضا</dt><dd id="expiry">—</dd><dt>وضعیت</dt><dd id="state">—</dd></dl><progress id="bar" max="1" value="0"></progress><p><small id="reported">در انتظار دریافت اطلاعات</small></p><p id="notice">در حال دریافت اطلاعات…</p><small>این لینک خصوصی است. مصرف همه دستگاه‌های این کانفیگ از یک حجم مشترک محاسبه می‌شود.</small></main><script>
const token=location.pathname.split('/').pop();const el=id=>document.getElementById(id);const gb=n=>n===null?'بدون سقف حجمی':(n/1e9).toLocaleString('fa-IR',{maximumFractionDigits:3})+' گیگابایت';
const states={active:'فعال',preparing:'در حال آماده‌سازی',exhausted:'حجم تمام شده',expired:'منقضی',blocked:'متوقف؛ با پشتیبانی تماس بگیرید',revoked:'لغوشده'};
async function refresh(){if(document.hidden)return;try{const r=await fetch('/api/usage/'+token,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error();const s=await r.json();el('label').textContent=s.label;el('total').textContent=gb(s.totalBytes);el('used').textContent=gb(s.usedBytes);el('remaining').textContent=gb(s.remainingBytes);el('expiry').textContent=new Date(s.expiresAt*1000).toLocaleString('fa-IR');el('state').textContent=states[s.state]||s.state;el('bar').value=s.totalBytes?Math.min(1,s.usedBytes/s.totalBytes):0;el('reported').textContent=s.lastReportAt?'آخرین گزارش: '+new Date(s.lastReportAt*1000).toLocaleString('fa-IR'):'هنوز گزارشی از سرور دریافت نشده';el('notice').textContent=!s.lastReportAt||Date.now()/1000-s.lastReportAt>15?'گزارش تازه نیست؛ اعداد آخرین گزارش نمایش داده شده‌اند.':'';}catch{el('notice').textContent='دریافت گزارش ممکن نشد؛ دوباره تلاش می‌کنیم.';}}
refresh();setInterval(refresh,5000);document.addEventListener('visibilitychange',refresh);
</script></html>
