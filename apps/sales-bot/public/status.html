<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>مصرف اشتراک مدار</title><style>
*{box-sizing:border-box}body{font:16px/1.8 system-ui;background:radial-gradient(ellipse at top,#15324b,#08111f 65%);color:#eaf2ff;margin:0;padding:20px;min-height:100vh}main{max-width:540px;margin:24px auto;background:#101e30;border:1px solid #263c52;border-radius:24px;padding:28px;box-shadow:0 20px 70px #0004}h1{font-size:24px;overflow-wrap:anywhere;margin:0 0 8px}dl{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:24px 0}dt,dd{padding:12px 0;border-bottom:1px solid #26374b}dt{color:#acbfd4}dd{margin:0;text-align:left;overflow-wrap:anywhere;font-weight:600}small{color:#aabbd3}#notice{color:#ffd18b;background:#ffffff06;border-radius:12px;padding:10px}#notice:empty{display:none}progress{width:100%;height:14px;accent-color:#49dab7;border:0;border-radius:20px;overflow:hidden}button{font:inherit;width:100%;padding:12px 20px;border:1px solid #39526d;border-radius:12px;background:#1e3650;color:#f1f7ff;cursor:pointer;margin:12px 0}button:hover{background:#294961}button:focus-visible{outline:3px solid #49dab7;outline-offset:3px}.eyebrow{color:#63dfc2;font-size:13px;letter-spacing:.06em}.intro{color:#aabbd3;margin:0}.privacy{display:block;border-top:1px solid #26374b;padding-top:18px;margin-top:16px}@media(max-width:420px){body{padding:12px}main{padding:20px;margin:12px auto}h1{font-size:21px}}
</style><main><div class="eyebrow">MADAR · مدار</div><h1 id="label">مصرف اشتراک مدار</h1><p class="intro">حجم و اعتبار اشتراک شما در یک نگاه</p><dl><dt>حجم کل</dt><dd id="total">—</dd><dt>مصرف ثبت‌شده</dt><dd id="used">—</dd><dt>باقی‌مانده</dt><dd id="remaining">—</dd><dt>انقضا</dt><dd id="expiry">—</dd><dt>وضعیت</dt><dd id="state">—</dd></dl><progress aria-label="میزان حجم مصرف‌شده" id="bar" max="1" value="0"></progress><p><small id="reported">در انتظار دریافت اطلاعات</small></p><button type="button" onclick="refresh()">↻ به‌روزرسانی مصرف</button><p id="notice" role="status" aria-live="polite">در حال دریافت اطلاعات…</p><small class="privacy">این لینک خصوصی است. مصرف همه دستگاه‌های این کانفیگ از یک حجم مشترک محاسبه می‌شود.</small></main><script>
const token=location.pathname.split('/').pop();const el=id=>document.getElementById(id);const gb=n=>n===null?'بدون سقف حجمی':(n/1e9).toLocaleString('fa-IR',{maximumFractionDigits:3})+' گیگابایت';
const states={active:'فعال',preparing:'در حال آماده‌سازی',exhausted:'حجم تمام شده',expired:'منقضی',blocked:'متوقف؛ با پشتیبانی تماس بگیرید',revoked:'لغوشده'};
async function refresh(){if(document.hidden)return;try{const r=await fetch('/api/usage/'+token,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error();const s=await r.json();el('label').textContent=s.label;el('total').textContent=gb(s.totalBytes);el('used').textContent=gb(s.usedBytes);el('remaining').textContent=gb(s.remainingBytes);el('expiry').textContent=new Date(s.expiresAt*1000).toLocaleString('fa-IR');el('state').textContent=states[s.state]||s.state;el('bar').value=s.totalBytes?Math.min(1,s.usedBytes/s.totalBytes):0;el('reported').textContent=s.lastReportAt?'آخرین گزارش: '+new Date(s.lastReportAt*1000).toLocaleString('fa-IR'):'هنوز گزارشی از سرور دریافت نشده';el('notice').textContent=!s.lastReportAt||Date.now()/1000-s.lastReportAt>15?'گزارش تازه نیست؛ اعداد آخرین گزارش نمایش داده شده‌اند.':'';}catch{el('notice').textContent='دریافت گزارش ممکن نشد؛ دوباره تلاش می‌کنیم.';}}
refresh();setInterval(refresh,5000);document.addEventListener('visibilitychange',refresh);
</script></html>
